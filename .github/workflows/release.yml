name: "_manual:release"

# Two ways in:
#   - Push a v*.*.* tag.
#   - Run this workflow by hand on main with a version, such as 0.2.0. The `tag`
#     job tags that commit and starts this workflow again on the tag, so the
#     signature identity is the same as for a pushed tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0. Must be in CHANGELOG.md."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag this commit and start the release on the tag
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 0.2.0"; exit 1; }
          grep -q "^## \[${VERSION}\] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no ${VERSION} section"; exit 1; }
          # Reuse the tag if an earlier run already made it on this commit, so a
          # failed start can be run again. A tag on any other commit is an error.
          existing=$(gh api "repos/${GH_REPO}/git/ref/tags/v${VERSION}" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}"
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::v${VERSION} already exists on a different commit (${existing})"; exit 1
          fi
          gh workflow run release.yml --ref "v${VERSION}" -f "version=${VERSION}"

  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -B -m unittest discover -s app -p 'test_*.py'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Detour Community Edition
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - run: mkdir -p release

      - name: Generate SBOM for release
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: release/detour-sh-ce-${{ github.ref_name }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign release files
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cd release
          echo "${IMAGE}@${DIGEST}" > "detour-sh-ce-${TAG}.image.txt"
          sha256sum detour-sh-ce-* > "detour-sh-ce-${TAG}.SHA256SUMS"
          for file in "detour-sh-ce-${TAG}.SHA256SUMS" "detour-sh-ce-${TAG}.sbom.cdx.json"; do
            cosign sign-blob --yes "$file" --bundle "$file.sigstore.json"
            jq -er '.messageSignature.signature' "$file.sigstore.json" > "$file.sig"
          done
          ls -l

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}:${version}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify the signature:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "The SBOM and checksums attached below are signed the same way. Verify one with:"
            echo
            echo '```'
            echo "cosign verify-blob detour-sh-ce-${TAG}.SHA256SUMS \\"
            echo "  --bundle detour-sh-ce-${TAG}.SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag release/*
