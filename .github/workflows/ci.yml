name: "_auto:deploy"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the MCP library
        run: python -m pip install --require-hashes -r app/requirements.txt

      - name: Unit tests
        run: python -B -m unittest discover -s app -p 'test_*.py'
        env:
          DETOUR_QUIET_HTTP: "true"

      - name: Portal theme tests
        # Plain Node, no install: the theme engine has no dependencies.
        run: node --test
        working-directory: app/web

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

      - name: Build image
        run: docker build --tag detour:ci ./app

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: detour:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: detour:ci
          format: cyclonedx-json
          output-file: detour-sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detour-sbom
          path: detour-sbom.cdx.json
          retention-days: 14

  ui:
    if: github.event_name != 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The portal needs a sign-in token. This one lives only for this job.
      - name: Make a sign-in token for the test run
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "DETOUR_PORTAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start Detour
        run: docker compose up -d --build --wait --wait-timeout 120 detour

      - name: Browser tests
        run: |
          mkdir -p artifacts/ui
          docker compose --profile test run --rm --no-deps ui-test

      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-report
          path: artifacts/ui
          retention-days: 7

      - name: Container logs
        if: failure()
        run: docker compose logs detour

      - name: Stop
        if: always()
        run: docker compose --profile test down -v

  # Keeps the issue tracker small: label new reports for a maintainer, and close
  # anything that did not come from an issue form or is mostly links. Uses only
  # the built-in token and the gh CLI, so there is no third-party code to trust.
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      ASSOCIATION: ${{ github.event.issue.author_association }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - name: Label the report, or close it if it skipped the form
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) exit 0 ;; esac
          reason=""
          if ! printf '%s' "$BODY" | grep -q '^### '; then
            reason="it was not created from one of the issue forms"
          elif [ "$(printf '%s' "$BODY" | grep -oE 'https?://' | wc -l)" -gt 5 ]; then
            reason="it contains more than five links"
          fi
          if [ -n "$reason" ]; then
            gh issue comment "$NUMBER" --body "Closing this because ${reason}. Please open a new issue with the form at https://github.com/${GH_REPO}/issues/new/choose and fill in every field."
            gh issue close "$NUMBER" --reason "not planned"
            exit 0
          fi
          gh label create needs-triage --color ededed --description "Waiting for a maintainer" 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label needs-triage
