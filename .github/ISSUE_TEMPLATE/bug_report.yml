name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security vulnerabilities here. See SECURITY.md.
        Remove any private context, keys, or personal data before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` in your clone.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Docker version, AI tool and version"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs detour`.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I reproduced this on the latest release or on `main`.
          required: true
        - label: I wrote or checked every part of this report myself. It is not unreviewed AI output.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
