version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/app", "/app/ui-tests"]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app/ui-tests
    schedule:
      interval: weekly
